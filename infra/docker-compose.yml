# Docker Compose 是本项目的一键运行入口。
# Makefile 默认通过 --env-file .env.docker 传入配置；.env 用于本地 debug。

services:
  backend-java:
    build:
      context: ../backend-java
    container_name: agent-backend-java
    ports:
      - "8080:8080"
    environment:
      SPRING_PROFILES_ACTIVE: docker
      SPRING_DATASOURCE_URL: ${SPRING_DATASOURCE_URL:-jdbc:mysql://host.docker.internal:3306/agentdb?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&connectTimeout=3000&socketTimeout=15000}
      SPRING_DATASOURCE_USERNAME: ${SPRING_DATASOURCE_USERNAME:-agent}
      SPRING_DATASOURCE_PASSWORD: ${SPRING_DATASOURCE_PASSWORD:-agent123}
      SPRING_DATA_REDIS_HOST: ${SPRING_DATA_REDIS_HOST:-host.docker.internal}
      SPRING_DATA_REDIS_PORT: ${SPRING_DATA_REDIS_PORT:-6379}
      SPRING_DATA_REDIS_PASSWORD: ${SPRING_DATA_REDIS_PASSWORD:-}
      AI_SERVICE_BASE_URL: ${AI_SERVICE_BASE_URL:-http://ai-service:8000}
      DIAGNOSIS_SERVICE_BASE_URL: ${DIAGNOSIS_SERVICE_BASE_URL:-http://host.docker.internal:8200}
      KB_UPLOAD_DIR: ${KB_UPLOAD_DIR:-/app/data/uploads/kb-docs}
      LOG_PATH: ${LOG_PATH:-/app/logs}
      KB_INGEST_SCRIPT_PATH: ${KB_INGEST_SCRIPT_PATH:-/app/scripts/ingest_docs.py}
      KB_INGEST_MYSQL_DSN: ${KB_INGEST_MYSQL_DSN:-mysql://agent:agent123@host.docker.internal:3306/agentdb}
    volumes:
      - ../data/backend/uploads:/app/data/uploads
      - ../logs/backend:/app/logs
      - ../scripts:/app/scripts:ro
      - ../shared:/app/shared:ro

  ai-service:
    build:
      context: ../ai-service
    container_name: agent-ai-service
    ports:
      - "8000:8000"
    environment:
      MYSQL_DSN: ${MYSQL_DSN:-mysql://agent:agent123@host.docker.internal:3306/agentdb}
      QDRANT_URL: ${QDRANT_URL:-http://host.docker.internal:6333}
      NEO4J_URI: ${NEO4J_URI:-bolt://host.docker.internal:7687}
      NEO4J_HTTP_URL: ${NEO4J_HTTP_URL:-http://host.docker.internal:7474}
      NEO4J_USER: ${NEO4J_USER:-neo4j}
      NEO4J_PASSWORD: ${NEO4J_PASSWORD:-agent123456}
      REDIS_URL: ${REDIS_URL:-redis://host.docker.internal:6379/0}
      JWT_SECRET: ${JWT_SECRET:-dev-secret-key-change-in-production-minimum-256-bits}
      JWT_ALGORITHMS: ${JWT_ALGORITHMS:-HS256,HS384,HS512}
      LLM_PROVIDER: ${LLM_PROVIDER:-openai-compatible}
      LLM_TOKEN: ${LLM_TOKEN:-}
      LLM_BASE_URL: ${LLM_BASE_URL:-}
      LLM_MODEL: ${LLM_MODEL:-}
      EMBEDDING_PROVIDER: ${EMBEDDING_PROVIDER:-dashscope}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-text-embedding-v4}
      EMBEDDING_DIMENSIONS: ${EMBEDDING_DIMENSIONS:-1024}
      EMBEDDING_BASE_URL: ${EMBEDDING_BASE_URL:-https://dashscope.aliyuncs.com/compatible-mode/v1}
      EMBEDDING_TOKEN: ${EMBEDDING_TOKEN:-}
      DASHSCOPE_TOKEN: ${DASHSCOPE_TOKEN:-}
      LOG_PATH: ${AI_SERVICE_LOG_PATH:-/app/logs}
      LOG_LEVEL: ${AI_SERVICE_LOG_LEVEL:-INFO}
    volumes:
      - ../logs/ai-service:/app/logs

  frontend:
    build:
      context: ../frontend
    container_name: agent-frontend
    depends_on:
      backend-java:
        condition: service_started
      ai-service:
        condition: service_started
    ports:
      - "3000:80"
    volumes:
      - ../logs/frontend:/var/log/nginx
