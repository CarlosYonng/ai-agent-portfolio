# Docker Compose 是本项目的一键运行入口。
# Makefile 默认通过 --env-file .env.docker 传入配置；.env 用于本地 debug。

services:
  mysql:
    image: mysql:8.4
    container_name: agent-mysql
    environment:
      MYSQL_DATABASE: agentdb
      MYSQL_USER: agent
      MYSQL_PASSWORD: agent123
      MYSQL_ROOT_PASSWORD: root123
    ports:
      - "3306:3306"
    volumes:
      - ./mysql/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -proot123 --silent"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7
    container_name: agent-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  qdrant:
    image: qdrant/qdrant:latest
    container_name: agent-qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage

  neo4j:
    image: neo4j:5
    container_name: agent-neo4j
    environment:
      NEO4J_AUTH: neo4j/agent123456
    ports:
      - "7474:7474"
      - "7687:7687"
    volumes:
      - neo4j_data:/data

  backend-java:
    build:
      context: ../backend-java
    container_name: agent-backend-java
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "8080:8080"
    environment:
      SPRING_PROFILES_ACTIVE: docker
      AI_SERVICE_BASE_URL: ${AI_SERVICE_BASE_URL:-http://ai-service:8000}

  ai-service:
    build:
      context: ../ai-service
    container_name: agent-ai-service
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      qdrant:
        condition: service_started
      neo4j:
        condition: service_started
    ports:
      - "8000:8000"
    environment:
      MYSQL_DSN: ${MYSQL_DSN:-mysql://agent:agent123@mysql:3306/agentdb}
      QDRANT_URL: ${QDRANT_URL:-http://qdrant:6333}
      NEO4J_URI: ${NEO4J_URI:-bolt://neo4j:7687}
      NEO4J_HTTP_URL: ${NEO4J_HTTP_URL:-http://neo4j:7474}
      NEO4J_USER: ${NEO4J_USER:-neo4j}
      NEO4J_PASSWORD: ${NEO4J_PASSWORD:-agent123456}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      MCP_BASE_URL: ${MCP_BASE_URL:-http://mcp-server:8100}
      LLM_PROVIDER: ${LLM_PROVIDER:-mock}
      LLM_TOKEN: ${LLM_TOKEN:-}
      LLM_BASE_URL: ${LLM_BASE_URL:-}
      LLM_MODEL: ${LLM_MODEL:-mock}
      EMBEDDING_PROVIDER: ${EMBEDDING_PROVIDER:-hash}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-hash}
      EMBEDDING_DIMENSIONS: ${EMBEDDING_DIMENSIONS:-128}
      EMBEDDING_BASE_URL: ${EMBEDDING_BASE_URL:-}
      EMBEDDING_TOKEN: ${EMBEDDING_TOKEN:-}
      DASHSCOPE_TOKEN: ${DASHSCOPE_TOKEN:-}

  mcp-server:
    build:
      context: ../mcp-server
    container_name: agent-mcp-server
    depends_on:
      mysql:
        condition: service_healthy
    ports:
      - "8100:8100"
    environment:
      MYSQL_DSN: ${MYSQL_DSN:-mysql://agent:agent123@mysql:3306/agentdb}

  frontend:
    build:
      context: ../frontend
    container_name: agent-frontend
    depends_on:
      backend-java:
        condition: service_started
    ports:
      - "3000:80"

volumes:
  mysql_data:
  qdrant_data:
  neo4j_data:
