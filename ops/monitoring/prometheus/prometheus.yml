global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/rules/portfolio-alerts.yml

scrape_configs:
  - job_name: ai-agent-portfolio-backend-java
    metrics_path: /actuator/prometheus
    static_configs:
      - targets:
          - backend-java:8080
        labels:
          service: ai-agent-portfolio

  - job_name: ai-agent-portfolio-ai-service
    metrics_path: /metrics
    static_configs:
      - targets:
          - ai-service:8000
        labels:
          service: portfolio-ai-service
